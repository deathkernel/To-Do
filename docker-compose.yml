services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_dev_only
    ports:
      - "5432:5432"
    volumes:
      - todo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://todo:todo_dev_only@postgres:5432/todo
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 3000
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://todo:todo_dev_only@postgres:5432/todo
      REDIS_URL: redis://redis:6379
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  todo_postgres:
