services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_dev_only
    ports:
      - "5432:5432"
    volumes:
      - todo_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://todo:todo_dev_only@postgres:5432/todo
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 3000
      APP_ENV: production
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://todo:todo_dev_only@postgres:5432/todo
      REDIS_URL: redis://redis:6379
      APP_ENV: production
    depends_on:
      - postgres
      - redis
volumes:
  todo_postgres:
