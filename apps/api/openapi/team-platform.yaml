openapi: 3.0.3
info:
  title: To-Do Team & Platform API
  version: 1.0.0
paths:
  /api/v1/projects/{projectId}/members:
    get:
      summary: List project members
    post:
      summary: Add project member
  /api/v1/projects/{projectId}/members/{userId}:
    patch:
      summary: Update project member role
    delete:
      summary: Remove project member
  /api/v1/workspaces:
    get:
      summary: List workspaces
    post:
      summary: Create workspace
  /api/v1/workspaces/{workspaceId}/members:
    get:
      summary: List workspace members
    post:
      summary: Invite workspace member
  /api/v1/auth/login:
    post:
      summary: Authenticate account
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh session
  /api/v1/auth/mfa:
    post:
      summary: Configure MFA
  /api/v1/backups/export:
    post:
      summary: Start account export
  /api/v1/backups/import/validate:
    post:
      summary: Validate an import
  /api/v1/sync/push:
    post:
      summary: Push offline operations
  /api/v1/sync/pull:
    get:
      summary: Pull changes after a cursor
  /api/v1/integrations:
    get:
      summary: List integrations
  /api/v1/integrations/{integrationId}/revoke:
    post:
      summary: Revoke integration
  /api/v1/tokens:
    post:
      summary: Create personal access token
  /api/v1/tokens/{tokenId}/revoke:
    post:
      summary: Revoke personal access token
  /api/v1/webhooks:
    post:
      summary: Create webhook
