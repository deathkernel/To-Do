openapi: 3.0.3
info:
  title: To-Do Automation & Experience API
  version: 1.0.0
paths:
  /api/v1/automations:
    get:
      summary: List automation rules
    post:
      summary: Create automation rule
  /api/v1/automations/{automationId}:
    patch:
      summary: Update automation rule
    delete:
      summary: Delete automation rule
  /api/v1/automations/{automationId}/executions:
    get:
      summary: List automation executions
  /api/v1/preferences:
    get:
      summary: Get user preferences
    patch:
      summary: Update user preferences
  /api/v1/devices:
    get:
      summary: List registered devices
    post:
      summary: Register device
  /api/v1/devices/{deviceId}/revoke:
    post:
      summary: Revoke device
  /api/v1/quick-add:
    post:
      summary: Parse and validate a quick-add command
  /api/v1/productivity/focus-sessions:
    post:
      summary: Start focus session
  /api/v1/productivity/reviews:
    get:
      summary: List planning reviews
    post:
      summary: Schedule planning review
